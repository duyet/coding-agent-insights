# GitHub Labeler Configuration (v6 format)
# Automatically labels PRs based on changed files

# Core functionality
cai-core:
  - changed-files:
      - any-glob-to-any-file: crates/cai-core/**/*

# Storage layer
cai-storage:
  - changed-files:
      - any-glob-to-any-file: crates/cai-storage/**/*

# Query engine
cai-query:
  - changed-files:
      - any-glob-to-any-file: crates/cai-query/**/*

# Data ingestion
cai-ingest:
  - changed-files:
      - any-glob-to-any-file: crates/cai-ingest/**/*

# Output formatting
cai-output:
  - changed-files:
      - any-glob-to-any-file: crates/cai-output/**/*

# CLI interface
cai-cli:
  - changed-files:
      - any-glob-to-any-file: crates/cai-cli/**/*

# Terminal UI
cai-tui:
  - changed-files:
      - any-glob-to-any-file: crates/cai-tui/**/*

# Web interface
cai-web:
  - changed-files:
      - any-glob-to-any-file: crates/cai-web/**/*

# Plugin system
cai-plugin:
  - changed-files:
      - any-glob-to-any-file:
          - crates/cai-plugin/**/*
          - plugin/**/*

# Testing
testing:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*
          - "**/tests/**/*.rs"
          - TESTING.md

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**.md"
          - docs/**/*
          - .github/ISSUE_TEMPLATE/**/*

# CI/CD
ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**/*
          - .github/CODEOWNERS
          - scripts/**/*

# Build configuration
build:
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.toml
          - Cargo.lock
          - .cargo/**/*
          - Makefile

# Dependencies
dependencies:
  - changed-files:
      - any-glob-to-any-file: "**/Cargo.toml"

# Breaking changes (matched by file path in v6)
breaking-change:
  - changed-files:
      - any-glob-to-any-file: crates/**/src/lib.rs
